upstream crm-backend {
    server ${CRM_BACKEND_UPSTREAM};
}

upstream crm-frontend {
    server ${CRM_FRONTEND_UPSTREAM};
}

upstream krakend {
    server ${KRAKEND_UPSTREAM};
}

upstream keycloak {
    server ${KEYCLOAK_UPSTREAM};
}
upstream minio{
    server ${MINIO_UPSTREAM};
}

map §http_upgrade §connection_upgrade {
    default "upgrade";
    '' "close";
}

# ---- Rate limit: the public enrolment leg ----------------------------------
#
# http context, which is where a limit_req_zone must live - and this file IS
# http context: the `upstream` and `map` blocks above are http-only directives,
# and nginx's stock config includes conf.d/*.conf from inside `http { }`.
#
# THE SERVICE CANNOT DO THIS ITSELF. KrakenD's input-header allow-list excludes
# X-Forwarded-For and X-Real-IP, and nothing sets x-source-ip, so
# `request.client.host` is the gateway's container address for EVERY caller.
# nginx is the only place in the chain that can see a real client IP.
#
# A per-row attempt counter in the application would be useless anyway: a
# guessed token never finds a row to count against. The only meaningful
# application-level signal is the global token-not-found counter.
#
# LIVE_ENROLL_RATE_LIMIT comes from .env.dev via the nginx-config one-shot's
# env_file. If it is ever missing, envsubst renders `rate=;` and nginx refuses
# to start - so do not delete the variable, raise it.
limit_req_zone §binary_remote_addr zone=live_enroll:1m rate=${LIVE_ENROLL_RATE_LIMIT};


server {
    listen 80;
    server_name ${DOMAIN_HOST};
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    # The ticket is a live credential in the query string: keep it out of this
    # server's access log, and preserve §args so a client that resolved an http
    # realtimeUrl still lands on the right https URL. §uri§is_args§args rather
    # than §request_uri only for symmetry with the location above.
    location = ${WEB_REALTIME_PATH} {
        access_log off;
        return 301 https://§host§uri§is_args§args;
    }
    location / {
        return 301 https://§host§request_uri;
    }
}

server {
    listen 80;
    server_name s3.${DOMAIN_HOST};
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    # The ticket is a live credential in the query string: keep it out of this
    # server's access log, and preserve §args so a client that resolved an http
    # realtimeUrl still lands on the right https URL. §uri§is_args§args rather
    # than §request_uri only for symmetry with the location above.
    location = ${WEB_REALTIME_PATH} {
        access_log off;
        return 301 https://§host§uri§is_args§args;
    }
    location / {
        return 301 https://§host§request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ${DOMAIN_HOST};

    # Outer bound on request bodies, mirroring the annexes' RequestLimitsMiddleware:
    # 2 MB by default (MAX_BODY_BYTES), raised to 50 MB on /api/ where the multipart
    # upload endpoints live (UPLOAD_MAX_BODY_BYTES). nginx is the coarse gate; each
    # service still enforces its own precise per-route cap behind it.
    #
    # This MUST be set explicitly. nginx's implicit default is 1 MB, which rejects
    # every real upload with a 413 generated by nginx itself — a bare HTML error
    # page that never reaches the app, so it carries no error_code the frontend can
    # map to a message.
    ssl_certificate ${SSL_CERT_PATH};
    ssl_certificate_key ${SSL_CERT_KEY_PATH};

    client_max_body_size 2m;

    location / {
        proxy_pass ${CRM_FRONTEND_PROTOCOL}://crm-frontend;
        include /etc/nginx/conf.d/proxy-common-headers.conf;
        proxy_set_header Upgrade §http_upgrade;
        proxy_set_header Connection §connection_upgrade;
        proxy_intercept_errors on;
        error_page 404 = @angular_spa_fallback;
    }

    location @angular_spa_fallback {
        # A missing *asset* must stay a 404 rather than be answered with the
        # index. Match §uri, not §request_uri: the latter carries the query
        # string, so a legitimate deep link ending in something extension-shaped
        # (?email=a@b.com, ?ref=https%3A%2F%2Fpartner.be) was being refused.
        if (§uri ~* "\.[A-Za-z0-9]{2,8}§") {
            return 404;
        }

        rewrite ^ /index.html break;
        proxy_pass ${CRM_FRONTEND_PROTOCOL}://crm-frontend;
        include /etc/nginx/conf.d/proxy-common-headers.conf;
    }

    # ── Realtime SSE: the ONE path that bypasses the API gateway ─────────────
    # Bypassed for two independent reasons: EventSource cannot send an
    # Authorization header (so KrakenD's auth/validator can never be satisfied),
    # and KrakenD buffers + JSON-decodes with a 3000ms global timeout. Authority
    # is minted BEHIND the gateway by POST /api/notifications/realtime/ticket;
    # this location carries none of its own.
    #
    # EXACT match (`=`), never a prefix, and `proxy_pass` deliberately carries NO
    # URI path. crm-backend performs NO authentication — it trusts x-user-id
    # blindly — so anything reachable here other than the ticket-authenticated
    # stream handler is an unauthenticated, cross-tenant API. Writing
    # `location /realtime/` or `proxy_pass ...://crm-backend/;` (trailing slash)
    # would map /realtime/me/members onto an unauthenticated GET /me/members.
    # That single character is the difference between this and a full breach.
    location = ${WEB_REALTIME_PATH} {
        proxy_pass ${CRM_BACKEND_PROTOCOL}://crm-backend;
        include /etc/nginx/conf.d/proxy-common-headers.conf;

        # The gateway-trust headers are FORGEABLE on this leg. An empty value
        # makes nginx DROP the header entirely, so the handler cannot read one
        # even by accident. The single-use ticket in ?t= is the only credential.
        proxy_set_header X-User-Id "";
        proxy_set_header X-Community-Id "";
        proxy_set_header X-User-Groups "";
        proxy_set_header X-User-Orgs "";
        proxy_set_header X-Source-Ip "";

        # proxy-common-headers.conf sets proxy_http_version 1.1 but not
        # Connection, and the default `close` is fine for a stream.
        proxy_set_header Connection "";

        # proxy_buffering off is the load-bearing directive; the app also sends
        # X-Accel-Buffering: no as a backstop. Do NOT add
        # chunked_transfer_encoding off — wrong for a body of unknown length.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # The single-use ticket travels in the query string, because EventSource
        # cannot set headers. Keep it out of the access log. NOTE: nginx still
        # writes the full request line to error_log on an upstream failure (e.g.
        # while crm-backend restarts) — accepted, because the ticket is dead
        # within 30s and is single-use.
        access_log off;
    }

    # ---- The platform's ONLY unauthenticated endpoint ----------------------
    #
    # `auth: false` on the `live-public` KrakenD entry removes the PRODUCER of
    # the x-user-* headers. It does NOT remove them from the request:
    # `input_headers` is global in the generator with no per-service override,
    # so a client-supplied x-user-id is forwarded verbatim to the backend -
    # removing it there would strip it from all 191 authenticated endpoints too.
    #
    # So this location is the only thing standing between a forged header and
    # `GatewayScopeMiddleware`, which reads those headers unconditionally on
    # EVERY request, this one included.
    #
    # EXACT match (`=`), never a prefix: `location /api/live-public/` would cover
    # anything later added under that namespace, unauthenticated, by default.
    location = /api/live-public/enroll {
        # An EXPLICIT URI on proxy_pass. The `/api/` block below relies on a
        # trailing slash to strip the prefix, and an `=` location does NOT
        # inherit that rewrite - without the path spelled out here, KrakenD
        # receives /api/live-public/enroll and 404s, which reads as a gateway
        # misconfiguration rather than as a proxy one.
        proxy_pass ${KRAKEND_PROTOCOL}://krakend/live-public/enroll;
        include /etc/nginx/conf.d/proxy-common-headers.conf;

        # The same five the SSE leg blanks, and for the same reason: an EMPTY
        # value makes nginx DROP the header entirely, so the handler cannot read
        # one even by accident. The single-use enrolment token in the body is
        # the only credential on this leg.
        proxy_set_header X-User-Id "";
        proxy_set_header X-Community-Id "";
        proxy_set_header X-User-Groups "";
        proxy_set_header X-User-Orgs "";
        proxy_set_header X-Source-Ip "";

        # burst, and nodelay. Without a burst a single verification run trips
        # its own limit; without nodelay the excess is QUEUED rather than
        # refused, which turns a rate limit into latency inside a request
        # KrakenD cuts at 3000 ms.
        limit_req zone=live_enroll burst=5 nodelay;

        # The body is a token and a connector name. The 50m on /api/ is for the
        # upload endpoints and has no business here: a public endpoint that
        # accepts 50 MB is a memory-exhaustion lever anyone can pull.
        client_max_body_size 4k;
    }

    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_pass ${KRAKEND_PROTOCOL}://krakend/;
        include /etc/nginx/conf.d/proxy-common-headers.conf;

        # The upload endpoints behind the gateway (allocation + simulation key
        # generation, news-board, administrative-document) accept bodies up to
        # UPLOAD_MAX_BODY_BYTES = 50 MB. Keep these two numbers in step.
        client_max_body_size 50m;
        proxy_set_header X-Forwarded-Host §host;
        proxy_set_header X-Forwarded-Port §server_port;
        proxy_set_header X-Forwarded-Prefix /api;
    }

    location = /keycloak {
        return 301 /keycloak/;
    }

    location /keycloak/ {
        proxy_pass ${KEYCLOAK_PROTOCOL}://keycloak;
        include /etc/nginx/conf.d/proxy-common-headers.conf;
        proxy_set_header Host §host:8087;
        proxy_set_header X-Forwarded-Host §host;
        proxy_set_header X-Forwarded-Port 8087;
        proxy_set_header Forwarded "host=§host:8087;proto=§scheme";
    }

    location /s3 {
        return 301 /s3/;
    }

    location /s3/ {
        proxy_pass ${MINIO_PROTOCOL}://minio;
        include /etc/nginx/conf.d/proxy-common-headers.conf;
        proxy_set_header X-Forwarded-Host §host;
        proxy_set_header X-Forwarded-Proto §scheme;
        proxy_set_header X-Forwarded-Prefix /minio;
    }
}

server {
    listen 443 ssl;
    server_name s3.${DOMAIN_HOST};

    ssl_certificate ${SSL_CERT_PATH};
    ssl_certificate_key ${SSL_CERT_KEY_PATH};

    location / {
        proxy_pass ${MINIO_PROTOCOL}://minio;
        include /etc/nginx/conf.d/proxy-common-headers.conf;
        proxy_set_header X-Forwarded-Host §host;
        proxy_set_header X-Forwarded-Proto §scheme;
    }
}