# ===========================================================================
# OptimCE Live Data — Mosquitto broker, dev.
#
# In-tree beside nginx/ and postgres/ rather than inside the live-data
# submodule, because it is infrastructure shared by compose rather than
# something the service owns.
#
# PINNED TO THE 2.1 LINE BY DIGEST in docker-compose.dev.yml, and that pin is
# LOAD-BEARING rather than hygiene: `%u` substitution in dynamic-security ACLs
# (below) arrived in Mosquitto 2.1.0 and does NOT exist in 2.0.x. On 2.0.x a
# `%u` ACL is treated as a literal topic string, so a device can publish
# NOWHERE - and the failure is silent all the way down: the broker starts, the
# plugin loads, enrolment succeeds, and no telemetry ever arrives. Never move
# the pin back.
#
# Note also the tag: `eclipse-mosquitto:2.1.2` does not exist. The 2.1 line is
# published only with an `-alpine` suffix.
# ===========================================================================

per_listener_settings false
# dynsec is a GLOBAL plugin. Stated explicitly so that "the ACLs did nothing"
# can never be explained by per-listener security. (Deprecated for removal in
# 3.0; it is written here while it still has meaning.)

# ---------------- listeners ----------------
#
# 1883, plaintext, NOT PUBLISHED. docker-compose.dev.yml maps no host port to
# it, so it is reachable only from the `backend` network - which is why the
# simulator runs inside the compose network rather than from the host. A
# published 1883 would put an authenticated-but-plaintext broker on the
# developer's LAN.
#
# The explicit 0.0.0.0 matters: a bare `listener 1883` binds to localhost INSIDE
# the container, and a correctly published port then gives a bare "connection
# refused" with no log line at all.
#
# Production adds `listener 8883` with the certificate and terminates TLS here
# (nginx cannot carry MQTT as configured: only conf.d is mounted, inside http{},
# and there is no stream{} context). Dev has no certificate and no 8883.
listener 1883 0.0.0.0

allow_anonymous false
# What makes every later "it connected" observation mean something.

max_packet_size 65536
# NOT `message_size_limit`, which 2.1 deprecates and 2.0.22 warns about at every
# start. Matches protocol §3.3's 64 KB cap.
#
# Enforced by DISCONNECTION, not by rejection. A device whose batch exceeds this
# is dropped mid-publish, and if it retries the identical batch it never
# recovers - the symptom reads as "the device flaps", not as "message too big".
# That is why the connector also caps measurements per message.

# ---------------- dynamic security ----------------
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
# On the DATA volume, because the plugin REWRITES this file on every mutating
# control command. Anywhere uid 1883 cannot write, `createClient` succeeds in
# memory, reports success, and vanishes on the next restart.
#
# THE FILE MUST EXIST BEFORE THE BROKER STARTS. On 2.1.x a missing
# dynamic-security.json is not a startup error - the broker generates its own,
# with a `democlient`, a `super-admin` role, an `unauthenticated` group and a
# `.pw` file holding both passwords in PLAINTEXT, while looking perfectly
# healthy because only enrolment fails. `mosquitto-init` is ordered before this
# container for exactly that reason.

# ---------------- persistence ----------------
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
# On a NAMED VOLUME. The image runs as uid 1883; a bind mount is created
# root-owned, and Mosquitto logs an error and CARRIES ON - sessions then
# silently do not survive a restart.

autosave_interval 30
autosave_on_changes false
# The default is 1800 SECONDS, and it is the difference between a queue that
# survives a crash and one that does not. Mosquitto also saves on a clean
# SIGTERM, so at the default a `docker compose stop` test passes and a
# `docker kill -s KILL` test loses everything queued - and you would blame
# persistence rather than the autosave window.
#
# Measured in Phase 0: with the default, a SIGKILL delivered 0 of 5 queued
# messages while the reconnecting client still got `session_present=True`. The
# session survived; everything in it did not.
#
# `autosave_on_changes false` is what makes the 30 above mean SECONDS rather
# than "every 30 changes".

# persistent_client_expiration  <-- DELIBERATELY ABSENT. Unset means NEVER.
# Setting it would purge the ingest worker's own session during exactly the long
# outage it exists to survive.

# ---------------- queueing ----------------
max_queued_messages 10000
max_queued_bytes 0
queue_qos0_messages false
max_inflight_messages 100
# Raised hard from the default of 1000: one worker outage across a real fleet
# exceeds that, and the broker then discards the excess with NO client-visible
# error.
#
# Phase 0 measured WHICH END is lost, and it is the counter-intuitive one: the
# OLDEST are kept and the NEWEST discarded (50 published against a limit of 20
# delivered SEQ-001..020). So a long outage loses the MOST RECENT data. The
# broker logs `Outgoing messages are being dropped for client <id>.` ONCE PER
# CLIENT - visible, but not countable.

# ---------------- observability ----------------
log_dest stdout
log_type all
# `all`, NOT `information`. An ACL denial is logged at DEBUG level, so at
# `information` it does not print AT ALL - the plan originally chose
# `information` reasoning that `all` "buries the refusals it exists to show",
# and the opposite is true. Same broker, same publish, one config line apart:
# at `information`, nothing; at `all`, `Denied PUBLISH from <client> ...`.
#
# And an ACL refusal is otherwise invisible from both ends: a denied publish is
# still PUBACKed at the MQTT layer, so the device sees success.
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true
