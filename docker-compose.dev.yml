services:
  # ONE instance, six logical databases — crm_db, allocation_key_local,
  # simulation_key_local, news_board_local, billing_local and
  # administrative_document_local — each owned by its own login role.
  #
  # NOT one database with six schemas. Every service in the platform documents
  # "cross-DB references are plain columns, never foreign keys", and separate
  # databases are what enforce that by physics; merge them and someone
  # eventually adds a real FK across a service boundary and the separation rots
  # silently. Consolidating the INSTANCES keeps the boundary and still gives
  # back five postmasters and five host ports.
  #
  # keycloak-db below stays its own container: Keycloak manages its own schema
  # and runs its own migrations at boot, and it is the one blast radius we are
  # not merging into the application's.
  #
  # See postgres/README.md.
  postgres:
    profiles: ["dev"]
    image: postgres:18-alpine@sha256:4da1a4828be12604092fa55311276f08f9224a74a62dcb4708bd7439e2a03911
    restart: unless-stopped
    # max_connections=300. The configured pools now all point at ONE instance:
    #     9 Python processes x (CRM 5+5 + LOCAL 5+5) = 180
    #     notification-dispatch (CRM only, 5+5)      =  10
    #     crm-backend (node-postgres default max)    =  10
    #                                                  ---
    #                                                  200
    # Seven instances each had their own default max_connections=100, so the
    # ceiling was never met anywhere and nobody noticed. One instance meets all
    # of it at once, and 100 is not enough. 300 = 200 + 3 superuser-reserved +
    # headroom for postgres-init, the verify scripts, a human psql, and the
    # overlap while compose recreates a container.
    #
    # shared_buffers=256MB — the seven instances reserved 7 x 128 MB between
    # them; one at 256 MB is under a third of that.
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=256MB"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=${POSTGRES_SUPERUSER_PASSWORD}
    # Parallel query allocates its dynamic shared memory in /dev/shm. Docker's
    # 64 MB default is what turns a large allocation-key run into "could not
    # resize shared memory segment".
    shm_size: 256mb
    # NOTHING is mounted into /docker-entrypoint-initdb.d, deliberately: those
    # scripts run only on an empty data directory and only against POSTGRES_DB,
    # so they can neither converge a rotated password nor reach a second
    # database. postgres-init below is the single provisioning path.
    #
    # No volume either, deliberately — dev databases stay ephemeral exactly as
    # they were, re-seeded from the mounted SQL on a fresh container.
    ports:
      - "8080:5432"
    networks:
      - backend
    healthcheck:
      # -h localhost (TCP) on purpose: the image entrypoint runs its bootstrap
      # phase with listen_addresses='', so only a TCP probe is correctly red
      # until the FINAL server is accepting. That is what makes
      # `service_healthy` meaningful for the sidecar.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Roles, databases, schemas, seeds and grants — converged on EVERY `up`,
  # mirroring minio-init. Same pinned image as the server, so psql matches the
  # server version exactly and there is no extra image to pull.
  #
  # profiles: ["dev"] only, NOT ["init", "dev"]: docker-stack.sh's init pass
  # ends with `--profile init ... down`, which would tear the server back down.
  #
  # If this container exits non-zero the whole stack refuses to start, by
  # design — a missing CRM grant produces no application error at all (the
  # annexes swallow it), so a half-provisioned instance would be invisible.
  postgres-init:
    profiles: ["dev"]
    image: postgres:18-alpine@sha256:4da1a4828be12604092fa55311276f08f9224a74a62dcb4708bd7439e2a03911
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - PGDATABASE=postgres
      - PGPASSWORD=${POSTGRES_SUPERUSER_PASSWORD}
      - CRM_DB_PASSWORD=${CRM_DB_PASSWORD}
      - ALLOCATION_KEY_DB_PASSWORD=${ALLOCATION_KEY_DB_PASSWORD}
      - SIMULATION_KEY_DB_PASSWORD=${SIMULATION_KEY_DB_PASSWORD}
      - NEWS_BOARD_DB_PASSWORD=${NEWS_BOARD_DB_PASSWORD}
      - BILLING_DB_PASSWORD=${BILLING_DB_PASSWORD}
      - ADMINISTRATIVE_DOCUMENT_DB_PASSWORD=${ADMINISTRATIVE_DOCUMENT_DB_PASSWORD}
      - NOTIFICATION_DISPATCH_DB_PASSWORD=${NOTIFICATION_DISPATCH_DB_PASSWORD}
    entrypoint: ["/bin/sh", "/postgres/provision/provision.sh"]
    volumes:
      - ./postgres:/postgres:ro
      # One mount per database, named by DATABASE and never by repo path — that
      # indirection is what lets production run the same provision.sh against a
      # different source (database_script/init.sql, or nothing at all before a
      # pg_restore) with no edit. Every file is reused verbatim; this workstream
      # forks none of them.
      #
      # NOTE: crm_db.sql opens with `DROP SCHEMA IF EXISTS public CASCADE` and
      # carries the demo seed data. provision.sh applies it ONLY when the
      # database has no tables — remove that guard and a restart wipes your
      # local CRM data.
      - ./crm-backend/tests/sql/init.sql:/schemas/crm_db.sql:ro
      - ./allocation-key-generation/scripts/sql/schema.sql:/schemas/allocation_key_local.sql:ro
      - ./simulation-key/scripts/sql/schema.sql:/schemas/simulation_key_local.sql:ro
      - ./news-board/scripts/sql/schema.sql:/schemas/news_board_local.sql:ro
      - ./billing/scripts/sql/schema.sql:/schemas/billing_local.sql:ro
      - ./administrative-document/scripts/sql/schema.sql:/schemas/administrative_document_local.sql:ro
      # Whole directory, applied in filename order AFTER the schema and on every
      # run: these are region reference data (deadline rules + the template
      # catalogue), idempotent by construction, and 0003 updates rows 0002
      # creates.
      - ./administrative-document/scripts/sql/seeds:/seeds/administrative_document_local:ro
    networks:
      - backend

  # The one database instance that is NOT consolidated. Keycloak manages its own
  # schema and runs its own migrations at boot, so its blast radius stays its
  # own. A useful side effect: the six service roles above cannot even resolve a
  # network route to this instance, which is a stronger guarantee than any
  # REVOKE inside a shared server.
  keycloak-db:
    profiles: ["dev"]
    image: postgres:18-alpine@sha256:4da1a4828be12604092fa55311276f08f9224a74a62dcb4708bd7439e2a03911
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=keycloak
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD}
    ports:
      - "8081:5432"
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  keycloak:
    profiles: ["dev"]
    build:
      context: keycloak
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      [
        "start-dev",
        "--import-realm",
        "--verbose",
        "--proxy-headers=xforwarded",
        "--http-relative-path=/keycloak",
      ]
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
      - KEYCLOAK_IMPORT=/opt/keycloak/data/import/realm-config.json
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KC_HOSTNAME=${KEYCLOAK_HOSTNAME}
      - KC_HOSTNAME_PORT=8087
      - KC_HTTP_ENABLED=true
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - "8082:8080"
    networks:
      - backend
      - reverse-proxy
    depends_on:
      keycloak-db:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
    volumes:
      - ./keycloak/realm/dev-config.json:/opt/keycloak/data/import/realm-config.json

  minio:
    profiles: ["dev"]
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "8091:9000"
      - "8092:9001"
    volumes:
      - minio_data:/data
    networks:
      - backend
      - reverse-proxy
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    profiles: ["dev"]
    image: pgsty/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-crm-files}
      - TEMPLATES_BUCKET=${TEMPLATES_BUCKET:-optimce-templates}
      - OUTPUT_BUCKET=${OUTPUT_BUCKET:-optimce-documents}
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local ${STORAGE_API_URL} $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/$${STORAGE_BUCKET:-crm-files};
      mc mb --ignore-existing local/$${TEMPLATES_BUCKET:-optimce-templates};
      mc mb --ignore-existing local/$${OUTPUT_BUCKET:-optimce-documents};
      mc cp --recursive /templates/billing local/$${TEMPLATES_BUCKET:-optimce-templates}/;
      mc cp --recursive /templates-admin/administrative-document local/$${TEMPLATES_BUCKET:-optimce-templates}/;
      exit 0;
      "
    volumes:
      # One mount per owning service: each ships the bundles for its own
      # documents, and the directory name inside becomes the key prefix
      # (`mc cp` of a directory preserves it), which is what
      # document_template.file_ref / *_TEMPLATE_URI point at.
      #
      # NOTE: this is `cp`, not `sync` — and document-generation caches bundles
      # on disk keyed by URI with no invalidation. Re-uploading to an existing
      # versioned prefix therefore has no effect until you
      # `up --force-recreate document-generation`. Bump the version directory
      # instead.
      - ./billing/document-templates:/templates:ro
      - ./administrative-document/document-templates:/templates-admin:ro
    networks:
      - backend

  nats:
    profiles: ["dev"]
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "8094:4222"
      - "8095:8222"
    volumes:
      - nats_data:/data
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - 'http://localhost:8222/healthz?js-enabled-only=true' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  jaeger:
    profiles: ["dev"]
    image: jaegertracing/jaeger:latest@sha256:bf7f805da4c2bc8d58a6c81ee650fdb6b8e4287698f95fbe231c09c865bc397f
    restart: unless-stopped
    ports:
      - "8084:6831/udp"
      - "8085:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - backend

  swagger-doc-gen:
    profiles: ["init", "dev"]
    build:
      context: crm-backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./krakend/config:/app/docs/openapi
    # No `sleep` between the two: swagger-autogen writes with fs.writeFileSync, so the
    # file is closed before the promise settles, and the `mv` runs in THIS container
    # through the same mount — there is no flush to wait on. A sleep here also could
    # never have helped krakend-config see the result, since it precedes the rename.
    # It used to be `&& sleep 3 &&`, and those three seconds were the window the init
    # profile's abort cascade used to SIGKILL this container in. See docker-stack.sh.
    command: sh -c "npm run swagger && mv /app/docs/openapi/swagger.yaml /app/docs/openapi/root.yaml"

  generation-doc-gen:
    profiles: ["init", "dev"]
    build:
      context: allocation-key-generation
      dockerfile: Dockerfile
    volumes:
      - ./krakend/config:/output
    environment:
      - ENV=local
      - CRM_DATABASE_URL=postgresql+asyncpg://placeholder:placeholder@placeholder:5432/placeholder
      - LOCAL_DATABASE_URL=postgresql+asyncpg://placeholder:placeholder@placeholder:5432/placeholder
      - ALLOW_ORIGIN=*
    entrypoint: ["python", "scripts/export_openapi.py", "/output/generation.json"]

  simulation-doc-gen:
    profiles: ["init", "dev"]
    build:
      context: simulation-key
      dockerfile: Dockerfile
    volumes:
      - ./krakend/config:/output
    environment:
      - ENV=local
      - CRM_DATABASE_URL=postgresql+asyncpg://placeholder:placeholder@placeholder:5432/placeholder
      - LOCAL_DATABASE_URL=postgresql+asyncpg://placeholder:placeholder@placeholder:5432/placeholder
      - ALLOW_ORIGIN=*
    entrypoint: ["python", "scripts/export_openapi.py", "/output/simulation.json"]

  news-doc-gen:
    profiles: ["init", "dev"]
    build:
      context: news-board
      dockerfile: Dockerfile
    volumes:
      - ./krakend/config:/output
    environment:
      - ENV=local
      - CRM_DATABASE_URL=postgresql+asyncpg://placeholder:placeholder@placeholder:5432/placeholder
      - LOCAL_DATABASE_URL=postgresql+asyncpg://placeholder:placeholder@placeholder:5432/placeholder
      - ALLOW_ORIGIN=*
    entrypoint: ["python", "scripts/export_openapi.py", "/output/news.json"]

  billing-doc-gen:
    profiles: ["init", "dev"]
    build:
      context: billing
      dockerfile: Dockerfile
    volumes:
      - ./krakend/config:/output
    environment:
      - ENV=local
      - CRM_DATABASE_URL=postgresql+asyncpg://placeholder:placeholder@placeholder:5432/placeholder
      - LOCAL_DATABASE_URL=postgresql+asyncpg://placeholder:placeholder@placeholder:5432/placeholder
      - ALLOW_ORIGIN=*
    entrypoint: ["python", "scripts/export_openapi.py", "/output/billing.json"]

  administrative-document-doc-gen:
    profiles: ["init", "dev"]
    build:
      context: administrative-document
      dockerfile: Dockerfile
    volumes:
      - ./krakend/config:/output
    environment:
      - ENV=local
      - CRM_DATABASE_URL=postgresql+asyncpg://placeholder:placeholder@placeholder:5432/placeholder
      - LOCAL_DATABASE_URL=postgresql+asyncpg://placeholder:placeholder@placeholder:5432/placeholder
      - ALLOW_ORIGIN=*
    entrypoint:
      ["python", "scripts/export_openapi.py", "/output/administrative-document.json"]

  krakend-config:
    profiles: ["init", "dev"]
    build:
      context: krakend/swagger2krakend
      dockerfile: Dockerfile
    volumes:
      - ./krakend/config:/config
    environment:
      - CONFIG_FILE=/config/krakend-builder.yaml
      - OUTPUT_FILE=/config/krakend.json
    depends_on:
      swagger-doc-gen:
        condition: service_completed_successfully
      generation-doc-gen:
        condition: service_completed_successfully
      simulation-doc-gen:
        condition: service_completed_successfully
      news-doc-gen:
        condition: service_completed_successfully
      billing-doc-gen:
        condition: service_completed_successfully
      administrative-document-doc-gen:
        condition: service_completed_successfully

  krakend:
    profiles: ["dev"]
    image: krakend:latest@sha256:bd392b692271209927da6c62f1b42d7f8f7bd0cd60b00d97c93bb5b8d42b4999
    ports:
      - "8086:8080"
    volumes:
      - ./krakend/config:/etc/krakend
    networks:
      - backend
      - reverse-proxy
    depends_on:
      crm-backend:
        condition: service_started
      allocation-key-generation:
        condition: service_started
      simulation-key:
        condition: service_started
      optimce-news-board:
        condition: service_started
      billing:
        condition: service_started
      administrative-document:
        condition: service_started
      keycloak:
        condition: service_started

  reverse-proxy:
    profiles: ["dev"]
    image: nginx:latest@sha256:7150b3a39203cb5bee612ff4a9d18774f8c7caf6399d6e8985e97e28eb751c18
    ports:
      - "8087:80"
      - "8088:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certs:/etc/nginx/certs
    networks:
      - reverse-proxy
    depends_on:
      nginx-config:
        condition: service_completed_successfully
      krakend:
        condition: service_started

  crm-backend:
    profiles: ["dev"]
    build:
      context: crm-backend
      dockerfile: Dockerfile.dev
    command: npm run dev
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=80
      - MICROSERVICE_NAME=crm-backend
      - ALLOWED_ORIGIN=${APP_CORS_ALLOWED_ORIGIN}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=80
      - IAM_SERVICE_NAME=KEYCLOAK
      - IAM_REALM=optimce-realm
      - IAM_REALM_NAME=optimce-realm
      - IAM_BASE_URL=http://keycloak:8080/keycloak
      - IAM_CLIENT_ID=optimce-backend
      - IAM_GRANT_TYPE=client_credentials
      - IAM_CLIENT_SECRET=${AUTH_CLIENT_SECRET}
      - STORAGE_SERVICE_NAME=S3
      - STORAGE_ENDPOINT=${STORAGE_API_URL}
      - STORAGE_REGION=us-east-1
      - STORAGE_BUCKET=${STORAGE_BUCKET:-crm-files}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - STORAGE_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT}
      - REMOTE_LOGGING=${REMOTE_LOGGING}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      # The only service that configures its database with discrete variables
      # rather than a DSN: config/{development,production}.cjs map these five and
      # there is no url: option on the TypeORM DataSource. (Which of the two
      # applies is decided by `npm run dev`, which forces NODE_ENV=development
      # over the value set above — they read the same five variables, so it makes
      # no difference here beyond the unused fallbacks.)
      #
      # DB_TYPE used to be on this list and was read by nothing:
      # database.connector.ts hardcodes type: "postgres".
      #
      # crm_svc OWNS crm_db, its `public` schema and every table in it — the
      # sidecar applies the schema under SET ROLE crm_svc. That is what keeps the
      # hand-applied database_script/*.sql migrations working, and what makes
      # ALTER DEFAULT PRIVILEGES in 30-crm-grants.sql attach to the right role.
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=crm_svc
      - DB_PASSWORD=${CRM_DB_PASSWORD}
      - DB_NAME=crm_db
      - REGULATORS_CONFIG_PATH=/app/reference/regulators.json
    volumes:
      - ./reference:/app/reference:ro
    ports:
      - "8089:80"
    networks:
      - backend
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started

  allocation-key-generation:
    profiles: ["dev"]
    build:
      context: allocation-key-generation
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ENV=local
      - CRM_DATABASE_URL=postgresql+asyncpg://allocation_key_svc:${ALLOCATION_KEY_DB_PASSWORD}@postgres:5432/crm_db
      - LOCAL_DATABASE_URL=postgresql+asyncpg://allocation_key_svc:${ALLOCATION_KEY_DB_PASSWORD}@postgres:5432/allocation_key_local
      - NATS_URL=nats://nats:4222
      - ALLOW_ORIGIN=*
      - CRM_DB_POOL_SIZE=5
      - CRM_DB_MAX_OVERFLOW=5
      - LOCAL_DB_POOL_SIZE=5
      - LOCAL_DB_MAX_OVERFLOW=5
      - STORAGE_ENDPOINT=${STORAGE_API_URL}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-crm-files}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - STORAGE_REGION=us-east-1
    ports:
      - "8002:8000"
    networks:
      - backend
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/readiness', timeout=3).status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  allocation-key-generation-worker:
    profiles: ["dev"]
    build:
      context: allocation-key-generation
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    cpus: "2.0"
    environment:
      - ENV=local
      - CRM_DATABASE_URL=postgresql+asyncpg://allocation_key_svc:${ALLOCATION_KEY_DB_PASSWORD}@postgres:5432/crm_db
      - LOCAL_DATABASE_URL=postgresql+asyncpg://allocation_key_svc:${ALLOCATION_KEY_DB_PASSWORD}@postgres:5432/allocation_key_local
      - NATS_URL=nats://nats:4222
      - ALLOW_ORIGIN=*
      - CRM_DB_POOL_SIZE=5
      - CRM_DB_MAX_OVERFLOW=5
      - LOCAL_DB_POOL_SIZE=5
      - LOCAL_DB_MAX_OVERFLOW=5
      - STORAGE_ENDPOINT=${STORAGE_API_URL}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-crm-files}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - STORAGE_REGION=us-east-1
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
    networks:
      - backend
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  simulation-key:
    profiles: ["dev"]
    build:
      context: simulation-key
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ENV=local
      - CRM_DATABASE_URL=postgresql+asyncpg://simulation_key_svc:${SIMULATION_KEY_DB_PASSWORD}@postgres:5432/crm_db
      - LOCAL_DATABASE_URL=postgresql+asyncpg://simulation_key_svc:${SIMULATION_KEY_DB_PASSWORD}@postgres:5432/simulation_key_local
      - NATS_URL=nats://nats:4222
      - ALLOW_ORIGIN=*
      - CRM_DB_POOL_SIZE=5
      - CRM_DB_MAX_OVERFLOW=5
      - LOCAL_DB_POOL_SIZE=5
      - LOCAL_DB_MAX_OVERFLOW=5
      - STORAGE_ENDPOINT=${STORAGE_API_URL}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-crm-files}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - STORAGE_REGION=us-east-1
    ports:
      - "8003:8000"
    networks:
      - backend
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/readiness', timeout=3).status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  simulation-key-worker:
    profiles: ["dev"]
    build:
      context: simulation-key
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    cpus: "2.0"
    environment:
      - ENV=local
      - CRM_DATABASE_URL=postgresql+asyncpg://simulation_key_svc:${SIMULATION_KEY_DB_PASSWORD}@postgres:5432/crm_db
      - LOCAL_DATABASE_URL=postgresql+asyncpg://simulation_key_svc:${SIMULATION_KEY_DB_PASSWORD}@postgres:5432/simulation_key_local
      - NATS_URL=nats://nats:4222
      - ALLOW_ORIGIN=*
      - CRM_DB_POOL_SIZE=5
      - CRM_DB_MAX_OVERFLOW=5
      - LOCAL_DB_POOL_SIZE=5
      - LOCAL_DB_MAX_OVERFLOW=5
      - STORAGE_ENDPOINT=${STORAGE_API_URL}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-crm-files}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - STORAGE_REGION=us-east-1
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
    networks:
      - backend
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  optimce-news-board:
    profiles: ["dev"]
    build:
      context: news-board
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ENV=local
      - CRM_DATABASE_URL=postgresql+asyncpg://news_board_svc:${NEWS_BOARD_DB_PASSWORD}@postgres:5432/crm_db
      - LOCAL_DATABASE_URL=postgresql+asyncpg://news_board_svc:${NEWS_BOARD_DB_PASSWORD}@postgres:5432/news_board_local
      - ALLOW_ORIGIN=*
      - CRM_DB_POOL_SIZE=5
      - CRM_DB_MAX_OVERFLOW=5
      - LOCAL_DB_POOL_SIZE=5
      - LOCAL_DB_MAX_OVERFLOW=5
    ports:
      - "8004:8000"
    networks:
      - backend
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/readiness', timeout=3).status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  billing:
    profiles: ["dev"]
    build:
      context: billing
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ENV=local
      - CRM_DATABASE_URL=postgresql+asyncpg://billing_svc:${BILLING_DB_PASSWORD}@postgres:5432/crm_db
      - LOCAL_DATABASE_URL=postgresql+asyncpg://billing_svc:${BILLING_DB_PASSWORD}@postgres:5432/billing_local
      - NATS_URL=nats://nats:4222
      - ALLOW_ORIGIN=*
      - CRM_DB_POOL_SIZE=5
      - CRM_DB_MAX_OVERFLOW=5
      - LOCAL_DB_POOL_SIZE=5
      - LOCAL_DB_MAX_OVERFLOW=5
      - STORAGE_ENDPOINT=${STORAGE_API_URL}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-crm-files}
      - OUTPUT_BUCKET=${OUTPUT_BUCKET:-optimce-documents}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - STORAGE_REGION=us-east-1
      - REGULATORS_CONFIG_PATH=/app/reference/regulators.json
      - DEFAULT_LOCALE=fr-BE
    volumes:
      - ./reference:/app/reference:ro
    ports:
      - "8005:8000"
    networks:
      - backend
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/readiness', timeout=3).status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  administrative-document:
    profiles: ["dev"]
    build:
      context: administrative-document
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ENV=local
      - CRM_DATABASE_URL=postgresql+asyncpg://administrative_document_svc:${ADMINISTRATIVE_DOCUMENT_DB_PASSWORD}@postgres:5432/crm_db
      - LOCAL_DATABASE_URL=postgresql+asyncpg://administrative_document_svc:${ADMINISTRATIVE_DOCUMENT_DB_PASSWORD}@postgres:5432/administrative_document_local
      - NATS_URL=nats://nats:4222
      - ALLOW_ORIGIN=*
      - CRM_DB_POOL_SIZE=5
      - CRM_DB_MAX_OVERFLOW=5
      - LOCAL_DB_POOL_SIZE=5
      - LOCAL_DB_MAX_OVERFLOW=5
      - STORAGE_ENDPOINT=${STORAGE_API_URL}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-crm-files}
      # Stored document versions share the platform document bucket, under this
      # service's own key prefix. Needs read+write on it.
      - OUTPUT_BUCKET=${OUTPUT_BUCKET:-optimce-documents}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - STORAGE_REGION=us-east-1
      # Rendering bundles. This service never opens them — document_template
      # .file_ref points into this bucket and document-generation fetches them —
      # but the name is declared so a misconfigured stack fails at boot.
      - TEMPLATES_BUCKET=${TEMPLATES_BUCKET:-optimce-templates}
      - DOCGEN_REQUEST_SUBJECT=docgen.request
      - DOCGEN_RESULT_SUBJECT=docgen.result.administrative_document
      # Maps community.regulator -> the region whose deadline rules apply.
      - REGULATORS_CONFIG_PATH=/app/reference/regulators.json
    volumes:
      - ./reference:/app/reference:ro
    ports:
      - "8006:8000"
    networks:
      - backend
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/readiness', timeout=3).status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  administrative-document-worker:
    profiles: ["dev"]
    build:
      context: administrative-document
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      - ENV=local
      - CRM_DATABASE_URL=postgresql+asyncpg://administrative_document_svc:${ADMINISTRATIVE_DOCUMENT_DB_PASSWORD}@postgres:5432/crm_db
      - LOCAL_DATABASE_URL=postgresql+asyncpg://administrative_document_svc:${ADMINISTRATIVE_DOCUMENT_DB_PASSWORD}@postgres:5432/administrative_document_local
      - NATS_URL=nats://nats:4222
      - ALLOW_ORIGIN=*
      - CRM_DB_POOL_SIZE=5
      - CRM_DB_MAX_OVERFLOW=5
      - LOCAL_DB_POOL_SIZE=5
      - LOCAL_DB_MAX_OVERFLOW=5
      - STORAGE_ENDPOINT=${STORAGE_API_URL}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-crm-files}
      - OUTPUT_BUCKET=${OUTPUT_BUCKET:-optimce-documents}
      - TEMPLATES_BUCKET=${TEMPLATES_BUCKET:-optimce-templates}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - STORAGE_REGION=us-east-1
      # Must match the API's: the API publishes the work message, the worker
      # turns it into a docgen request and listens for the reply here.
      - DOCGEN_REQUEST_SUBJECT=docgen.request
      - DOCGEN_RESULT_SUBJECT=docgen.result.administrative_document
      - REGULATORS_CONFIG_PATH=/app/reference/regulators.json
    volumes:
      - ./reference:/app/reference:ro
    networks:
      - backend
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      # Start the API first: it declares the ADMIN_DOCUMENT work-queue stream
      # this worker consumes from, so without it the first subscribe fails.
      administrative-document:
        condition: service_started
      # And docgen, so its DOCGEN_RESULTS stream usually exists before we bind to
      # it. Streams are created asynchronously after it starts, so the background
      # subscribe-retry in worker/dispatcher.py is the real guarantee.
      document-generation:
        condition: service_started

  billing-worker:
    profiles: ["dev"]
    build:
      context: billing
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      - ENV=local
      - CRM_DATABASE_URL=postgresql+asyncpg://billing_svc:${BILLING_DB_PASSWORD}@postgres:5432/crm_db
      - LOCAL_DATABASE_URL=postgresql+asyncpg://billing_svc:${BILLING_DB_PASSWORD}@postgres:5432/billing_local
      - NATS_URL=nats://nats:4222
      - ALLOW_ORIGIN=*
      - CRM_DB_POOL_SIZE=5
      - CRM_DB_MAX_OVERFLOW=5
      - LOCAL_DB_POOL_SIZE=5
      - LOCAL_DB_MAX_OVERFLOW=5
      - STORAGE_ENDPOINT=${STORAGE_API_URL}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-crm-files}
      - OUTPUT_BUCKET=${OUTPUT_BUCKET:-optimce-documents}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - STORAGE_REGION=us-east-1
      - REGULATORS_CONFIG_PATH=/app/reference/regulators.json
      - DEFAULT_LOCALE=fr-BE
    volumes:
      - ./reference:/app/reference:ro
    networks:
      - backend
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      # Start docgen first so its DOCGEN_RESULTS stream usually exists before we
      # subscribe. Streams are created asynchronously after docgen starts, so the
      # background subscribe-retry in worker/dispatcher.py is the real guarantee.
      document-generation:
        condition: service_started

  document-generation:
    profiles: ["dev"]
    build:
      context: document-generation
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      - ENV=local
      - NATS_URL=nats://nats:4222
      - STORAGE_ENDPOINT=${STORAGE_API_URL}
      - TEMPLATES_BUCKET=${TEMPLATES_BUCKET:-optimce-templates}
      - OUTPUT_BUCKET=${OUTPUT_BUCKET:-optimce-documents}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - STORAGE_REGION=us-east-1
    networks:
      - backend
    depends_on:
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # The only thing in the platform that sends email. Worker-only, like
  # document-generation: no port, no gateway route, no OpenAPI export — sending
  # is purely outbound, so there is nothing to listen on. It owns no database
  # either; the outbound_message queue lives in the CRM schema so that a
  # producer's enqueue rides on its own transaction.
  notification-dispatch:
    profiles: ["dev"]
    build:
      context: notification-dispatch
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      - ENV=local
      - CRM_DATABASE_URL=postgresql+asyncpg://notification_dispatch_svc:${NOTIFICATION_DISPATCH_DB_PASSWORD}@postgres:5432/crm_db
      - CRM_DB_POOL_SIZE=5
      - CRM_DB_MAX_OVERFLOW=5
      # Mailpit in dev. Set EMAIL_TRANSPORT=BREVO and BREVO_API_KEY to send for
      # real; NOOP is refused outside local/test because it would mark every
      # message SENT while no mail left the building.
      - EMAIL_TRANSPORT=${EMAIL_TRANSPORT:-SMTP}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-no-reply@optimce.be}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-OptimCE}
      - EMAIL_REPLY_TO=${EMAIL_REPLY_TO:-}
      - EMAIL_MESSAGE_ID_DOMAIN=${EMAIL_MESSAGE_ID_DOMAIN:-optimce.be}
      - APP_URL=${DOMAIN}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-false}
      - SMTP_TLS=${SMTP_TLS:-false}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_BASE_URL=${BREVO_BASE_URL:-https://api.brevo.com}
      - BREVO_SUPPRESSION_SYNC_INTERVAL_SECONDS=${BREVO_SUPPRESSION_SYNC_INTERVAL_SECONDS:-3600}
      - DISPATCH_POLL_INTERVAL_SECONDS=${DISPATCH_POLL_INTERVAL_SECONDS:-15}
      - DEFAULT_LOCALE=${EMAIL_DEFAULT_LOCALE:-fr}
    networks:
      - backend
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  # Catches every message the dev stack sends, so a local run can never reach a
  # real mailbox. The published port is the web UI — the one legitimate
  # exception to "workers have no ports" here, since the whole point is that a
  # human opens it. SMTP stays on 1025, internal to the backend network.
  mailpit:
    profiles: ["dev"]
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
    ports:
      - "8007:8025"
    networks:
      - backend

  keycloak-config:
    profiles: ["init", "dev"]
    image: ghcr.io/ourouk/alpine-envsubst:main@sha256:10899e32576d793f054ddbf23889dc6ef6295726d350a377efc110a976c1a11e
    env_file:
      - .env.dev
    volumes:
      - ./keycloak/realm:/config
    command:
      - < /config/dev-config.template.json > /config/dev-config.json

  nginx-config:
    profiles: ["init", "dev"]
    image: ghcr.io/ourouk/alpine-envsubst:main@sha256:10899e32576d793f054ddbf23889dc6ef6295726d350a377efc110a976c1a11e
    env_file:
      - .env.dev
    environment:
      - CRM_FRONTEND_UPSTREAM=crm-frontend:80
      - KRAKEND_UPSTREAM=krakend:8080
      - KEYCLOAK_UPSTREAM=keycloak:8080
      - MINIO_UPSTREAM=minio:9000
      - CRM_FRONTEND_PROTOCOL=http
      - KRAKEND_PROTOCOL=http
      - KEYCLOAK_PROTOCOL=http
      - MINIO_PROTOCOL=http
    volumes:
      - ./nginx/conf-template.d:/config
      - ./nginx/conf.d:/output
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        if [ "${USE_HTTPS}" = "true" ]; then
          cp /config/default-https.template.conf /tmp/template.conf;
        else
          cp /config/default-http.template.conf /tmp/template.conf;
        fi
        envsubst < /tmp/template.conf | sed 's/§/$/g' > /output/default.conf

  crm-frontend-config:
    profiles: ["init", "dev"]
    image: ghcr.io/ourouk/alpine-envsubst:main@sha256:10899e32576d793f054ddbf23889dc6ef6295726d350a377efc110a976c1a11e
    env_file:
      - .env.dev
    volumes:
      - ./crm-frontend-config:/config
    command:
      - < /config/config.template.json > /config/config.json

  crm-frontend:
    profiles: ["dev"]
    build:
      context: crm-frontend
      dockerfile: Dockerfile
    # keycloak and reverse-proxy already gate on their own config containers this way;
    # this one did not. config.json below is gitignored, so without the gate Docker
    # resolves the bind source before crm-frontend-config has written it and creates a
    # DIRECTORY there instead — nginx then serves a directory at the config URL and the
    # app boots with no runtime config. A blank page whose only symptom shows up in the
    # browser console, nowhere near the cause.
    depends_on:
      crm-frontend-config:
        condition: service_completed_successfully
    volumes:
      - ./crm-frontend-config/config.json:/usr/share/nginx/html/assets/config/config.json
    environment:
      - NODE_ENV=production
    ports:
      - "8090:80"
    networks:
      - reverse-proxy

volumes:
  minio_data:
  nats_data:

networks:
  backend:
  reverse-proxy:
