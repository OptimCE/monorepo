      nginx-config:
        condition: service_completed_successfully
      krakend:
        condition: service_started

  crm-backend:
    profiles: ["dev"]
    build:
      context: crm-backend
      dockerfile: Dockerfile.dev
    command: npm run dev
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=80
      - MICROSERVICE_NAME=crm-backend
      - ALLOWED_ORIGIN=${APP_CORS_ALLOWED_ORIGIN}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=80
      - IAM_SERVICE_NAME=KEYCLOAK
      - IAM_REALM=optimce-realm
      - IAM_REALM_NAME=optimce-realm
      - IAM_BASE_URL=http://keycloak:8080/keycloak
      - IAM_CLIENT_ID=optimce-backend
      - IAM_GRANT_TYPE=client_credentials
      - IAM_CLIENT_SECRET=${AUTH_CLIENT_SECRET}
      - STORAGE_SERVICE_NAME=S3
      - STORAGE_ENDPOINT=${STORAGE_API_URL}
      - STORAGE_REGION=us-east-1
      - STORAGE_BUCKET=${STORAGE_BUCKET:-crm-files}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - STORAGE_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT}
      - REMOTE_LOGGING=${REMOTE_LOGGING}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      # The only service that configures its database with discrete variables
      # rather than a DSN: config/{development,production}.cjs map these five and
      # there is no url: option on the TypeORM DataSource. (Which of the two
      # applies is decided by `npm run dev`, which forces NODE_ENV=development
      # over the value set above — they read the same five variables, so it makes
      # no difference here beyond the unused fallbacks.)
      #
      # DB_TYPE used to be on this list and was read by nothing:
      # database.connector.ts hardcodes type: "postgres".
      #
      # crm_svc OWNS crm_db, its `public` schema and every table in it — the
      # sidecar applies the schema under SET ROLE crm_svc. That is what keeps the
      # hand-applied database_script/*.sql migrations working, and what makes
      # ALTER DEFAULT PRIVILEGES in 30-crm-grants.sql attach to the right role.
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=crm_svc
      - DB_PASSWORD=${CRM_DB_PASSWORD}
      - DB_NAME=crm_db
      - REGULATORS_CONFIG_PATH=/app/reference/regulators.json
      # Realtime (SSE). db 1 on purpose: db 0 stays reserved for the currently
      # dormant cache_service, which is a DIFFERENT switch — see
      # src/container/factory/realtime.factory.ts. With REALTIME_ENABLED=false
      # nothing is bound, no connection is opened, and clients stay on polling.
      - REALTIME_ENABLED=${REALTIME_ENABLED}
      - REALTIME_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - REALTIME_TICKET_TTL_SECONDS=${REALTIME_TICKET_TTL_SECONDS}
      - REALTIME_MAX_CONNECTION_SECONDS=${REALTIME_MAX_CONNECTION_SECONDS}
      - REALTIME_MAX_CONNECTIONS_PER_USER=${REALTIME_MAX_CONNECTIONS_PER_USER}
      # Address geocoding + the BeSt Address picker. These keys were read by the
      # code from the day geocoding shipped but never surfaced here, so the
      # service ran on its compiled-in defaults and GEOCODING_MODE=REMOTE could
      # only be set by editing the file.
      #
      # BEST_ADDRESS_URL blank == the picker is OFF. It defaults to the
      # `best-address` service, which now starts with the rest of the stack, so
      # the feature works out of the box. The `-` (not `:-`) form fills in only
      # when the variable is UNSET, which is what lets a deliberately blank value
      # in .env.dev still turn the feature off.
      - GEOCODING_MODE=${GEOCODING_MODE:-LOCAL}
      - GEOCODING_TIMEOUT_MS=${GEOCODING_TIMEOUT_MS:-2000}
      - GEOCODING_BATCH_MAX=${GEOCODING_BATCH_MAX:-1000}
      - GEOCODING_BACKFILL_OPERATORS=${GEOCODING_BACKFILL_OPERATORS:-}
      - BEST_ADDRESS_URL=${BEST_ADDRESS_URL-http://best-address:8080/belgianAddress/v2}
      - BEST_ADDRESS_TIMEOUT_MS=${BEST_ADDRESS_TIMEOUT_MS:-1500}
      # Annex catalogue. config/annexes-services.json is baked into the image and
      # shared with production, so an annex whose service is not deployed
      # everywhere ships "defaultEnabled": false and a deployment opts in here.
      # DISABLE wins over ENABLE. A name the image's catalogue does not contain
      # refuses the boot; under `tsx watch` only the log says so (operation
      # annexes_services:catalog_overrides). The set served is logged once at
      # boot as annexes_services:catalog_loaded. Values: see .env.dev.
      - ANNEX_CATALOG_ENABLE=${ANNEX_CATALOG_ENABLE:-}
      - ANNEX_CATALOG_DISABLE=${ANNEX_CATALOG_DISABLE:-}
    volumes:
      - ./reference:/app/reference:ro
    # Loopback-only. crm-backend performs NO authentication of its own — it
    # trusts x-user-id blindly (shared/middlewares/context.ts) — so a port
    # reachable off-host is an unauthenticated, cross-tenant read/write API.
    # Reach it through the reverse proxy (8087) instead.
    ports:
      - "127.0.0.1:8089:80"
    # `sse` exists solely so reverse-proxy can reach this service for
    # `location = /realtime/stream`. Deliberately NOT the `reverse-proxy`
    # network: that also holds crm-frontend, and a compromised static frontend
    # must not be able to call this API with forged x-user-id headers.
    networks:
      - backend
      - sse
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
      redis:
        condition: service_healthy

