services:
  # ONE instance, six logical databases — crm_db, allocation_key_local,
  # simulation_key_local, news_board_local, billing_local and
  # administrative_document_local — each owned by its own login role.
  #
  # NOT one database with six schemas. Every service in the platform documents
  # "cross-DB references are plain columns, never foreign keys", and separate
  # databases are what enforce that by physics; merge them and someone
  # eventually adds a real FK across a service boundary and the separation rots
  # silently. Consolidating the INSTANCES keeps the boundary and still gives
  # back five postmasters and five host ports.
  #
  # keycloak-db below stays its own container: Keycloak manages its own schema
  # and runs its own migrations at boot, and it is the one blast radius we are
  # not merging into the application's.
  #
  # See postgres/README.md.
  postgres:
    profiles: ["dev"]
    image: postgres:18-alpine@sha256:4da1a4828be12604092fa55311276f08f9224a74a62dcb4708bd7439e2a03911
    restart: unless-stopped
    # max_connections=300. The configured pools now all point at ONE instance:
    #     9 Python processes x (CRM 5+5 + LOCAL 5+5) = 180
    #     notification-dispatch (CRM only, 5+5)      =  10
    #     crm-backend (node-postgres default max)    =  10
    #                                                  ---
    #                                                  200
    # Seven instances each had their own default max_connections=100, so the
    # ceiling was never met anywhere and nobody noticed. One instance meets all
    # of it at once, and 100 is not enough. 300 = 200 + 3 superuser-reserved +
    # headroom for postgres-init, the verify scripts, a human psql, and the
    # overlap while compose recreates a container.
    #
    # shared_buffers=256MB — the seven instances reserved 7 x 128 MB between
    # them; one at 256 MB is under a third of that.
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=256MB"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=${POSTGRES_SUPERUSER_PASSWORD}
    # Parallel query allocates its dynamic shared memory in /dev/shm. Docker's
    # 64 MB default is what turns a large allocation-key run into "could not
    # resize shared memory segment".
    shm_size: 256mb
    # NOTHING is mounted into /docker-entrypoint-initdb.d, deliberately: those
    # scripts run only on an empty data directory and only against POSTGRES_DB,
    # so they can neither converge a rotated password nor reach a second
    # database. postgres-init below is the single provisioning path.
    #
    # No volume either, deliberately — dev databases stay ephemeral exactly as
    # they were, re-seeded from the mounted SQL on a fresh container.
    ports:
      - "8080:5432"
    networks:
      - backend
    healthcheck:
      # -h localhost (TCP) on purpose: the image entrypoint runs its bootstrap
      # phase with listen_addresses='', so only a TCP probe is correctly red
      # until the FINAL server is accepting. That is what makes
      # `service_healthy` meaningful for the sidecar.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Roles, databases, schemas, seeds and grants — converged on EVERY `up`,
  # mirroring minio-init. Same pinned image as the server, so psql matches the
  # server version exactly and there is no extra image to pull.
  #
  # profiles: ["dev"] only, NOT ["init", "dev"]: docker-stack.sh's init pass
  # ends with `--profile init ... down`, which would tear the server back down.
  #
  # If this container exits non-zero the whole stack refuses to start, by
  # design — a missing CRM grant produces no application error at all (the
  # annexes swallow it), so a half-provisioned instance would be invisible.
  postgres-init:
    profiles: ["dev"]
    image: postgres:18-alpine@sha256:4da1a4828be12604092fa55311276f08f9224a74a62dcb4708bd7439e2a03911
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - PGDATABASE=postgres
      - PGPASSWORD=${POSTGRES_SUPERUSER_PASSWORD}
      - CRM_DB_PASSWORD=${CRM_DB_PASSWORD}
      - ALLOCATION_KEY_DB_PASSWORD=${ALLOCATION_KEY_DB_PASSWORD}
      - SIMULATION_KEY_DB_PASSWORD=${SIMULATION_KEY_DB_PASSWORD}
      - NEWS_BOARD_DB_PASSWORD=${NEWS_BOARD_DB_PASSWORD}
      - BILLING_DB_PASSWORD=${BILLING_DB_PASSWORD}
      - ADMINISTRATIVE_DOCUMENT_DB_PASSWORD=${ADMINISTRATIVE_DOCUMENT_DB_PASSWORD}
      - NOTIFICATION_DISPATCH_DB_PASSWORD=${NOTIFICATION_DISPATCH_DB_PASSWORD}
      - LIVE_DATA_DB_PASSWORD=${LIVE_DATA_DB_PASSWORD}
    entrypoint: ["/bin/sh", "/postgres/provision/provision.sh"]
    volumes:
      - ./postgres:/postgres:ro
      # One mount per database, named by DATABASE and never by repo path — that
      # indirection is what lets production run the same provision.sh against a
      # different source (database_script/init.sql, or nothing at all before a
      # pg_restore) with no edit. Every file is reused verbatim; this workstream
      # forks none of them.
      #
      # NOTE: crm_db.sql opens with `DROP SCHEMA IF EXISTS public CASCADE` and
      # carries the demo seed data. provision.sh applies it ONLY when the
      # database has no tables — remove that guard and a restart wipes your
      # local CRM data.
      - ./crm-backend/tests/sql/init.sql:/schemas/crm_db.sql:ro
      - ./allocation-key-generation/scripts/sql/schema.sql:/schemas/allocation_key_local.sql:ro
      - ./simulation-key/scripts/sql/schema.sql:/schemas/simulation_key_local.sql:ro
      - ./news-board/scripts/sql/schema.sql:/schemas/news_board_local.sql:ro
      - ./billing/scripts/sql/schema.sql:/schemas/billing_local.sql:ro
      - ./administrative-document/scripts/sql/schema.sql:/schemas/administrative_document_local.sql:ro
      # If this path is missing, Docker CREATES AN EMPTY DIRECTORY here and
      # provision.sh logs "schema skipped" and exits 0 - leaving a
      # health-green service over a database with no tables. live-data's
      # /health/readiness reads schema_version rather than SELECT 1 so that
      # this fails loudly instead.
      - ./live-data/scripts/sql/schema.sql:/schemas/live_data_local.sql:ro
      # Whole directory, applied in filename order AFTER the schema and on every
      # run: these are region reference data (deadline rules + the template
      # catalogue), idempotent by construction, and 0003 updates rows 0002
      # creates.
      - ./administrative-document/scripts/sql/seeds:/seeds/administrative_document_local:ro
    networks:
      - backend

  # The one database instance that is NOT consolidated. Keycloak manages its own
  # schema and runs its own migrations at boot, so its blast radius stays its
  # own. A useful side effect: the six service roles above cannot even resolve a
  # network route to this instance, which is a stronger guarantee than any
  # REVOKE inside a shared server.
  keycloak-db:
    profiles: ["dev"]
    image: postgres:18-alpine@sha256:4da1a4828be12604092fa55311276f08f9224a74a62dcb4708bd7439e2a03911
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=keycloak
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD}
    ports:
      - "8081:5432"
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  keycloak:
    profiles: ["dev"]
    build:
      context: keycloak
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      [
        "start-dev",
        "--import-realm",
        "--verbose",
        "--proxy-headers=xforwarded",
        "--http-relative-path=/keycloak",
      ]
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
      - KEYCLOAK_IMPORT=/opt/keycloak/data/import/realm-config.json
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KC_HOSTNAME=${KEYCLOAK_HOSTNAME}
      - KC_HOSTNAME_PORT=8087
      - KC_HTTP_ENABLED=true
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - "8082:8080"
    networks:
      - backend
      - reverse-proxy
    depends_on:
      keycloak-db:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
    volumes:
      - ./keycloak/realm/dev-config.json:/opt/keycloak/data/import/realm-config.json

  minio:
    profiles: ["dev"]
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "8091:9000"
      - "8092:9001"
    volumes:
      - minio_data:/data
    networks:
      - backend
      - reverse-proxy
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    profiles: ["dev"]
    image: pgsty/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-crm-files}
      - TEMPLATES_BUCKET=${TEMPLATES_BUCKET:-optimce-templates}
      - OUTPUT_BUCKET=${OUTPUT_BUCKET:-optimce-documents}
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local ${STORAGE_API_URL} $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/$${STORAGE_BUCKET:-crm-files};
      mc mb --ignore-existing local/$${TEMPLATES_BUCKET:-optimce-templates};
      mc mb --ignore-existing local/$${OUTPUT_BUCKET:-optimce-documents};
      mc cp --recursive /templates/billing local/$${TEMPLATES_BUCKET:-optimce-templates}/;
      mc cp --recursive /templates-admin/administrative-document local/$${TEMPLATES_BUCKET:-optimce-templates}/;
      exit 0;
      "
    volumes:
      # One mount per owning service: each ships the bundles for its own
      # documents, and the directory name inside becomes the key prefix
      # (`mc cp` of a directory preserves it), which is what
      # document_template.file_ref / *_TEMPLATE_URI point at.
      #
      # NOTE: this is `cp`, not `sync` — and document-generation caches bundles
      # on disk keyed by URI with no invalidation. Re-uploading to an existing
      # versioned prefix therefore has no effect until you
      # `up --force-recreate document-generation`. Bump the version directory
      # instead.
      - ./billing/document-templates:/templates:ro
      - ./administrative-document/document-templates:/templates-admin:ro
    networks:
      - backend

  nats:
    profiles: ["dev"]
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "8094:4222"
      - "8095:8222"
    volumes:
      - nats_data:/data
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - 'http://localhost:8222/healthz?js-enabled-only=true' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Realtime fan-out ONLY: SSE pub/sub on `notify:v1:*` plus the single-use SSE
  # tickets. Deliberately NOT the JetStream broker above — job dispatch must not
  # lose messages, realtime is ALLOWED to. A separate container makes "realtime
  # may drop" structurally true and stops anyone making it durable later.
  #
  # No volume, no AOF, no RDB: every key here is either a <=30s ticket or an
  # in-flight PUBLISH, so losing everything on restart is CORRECT behaviour.
  # `--save ""` also removes the fork-on-BGSAVE latency spike.
  #
  # --requirepass is NOT hygiene. Redis has no auth by default, this sits on the
  # `backend` network alongside nine services, and the LIVE TICKET STORE lives in
  # it: unauthenticated, anything on that network could read every in-flight
  # ticket with its channel list and impersonate any connecting user.
  #
  # env_file is load-bearing: the healthcheck's `$$REDIS_PASSWORD` expands inside
  # the container, so without it redis-cli authenticates with an empty password,
  # never returns PONG, and crm-backend (which gates on service_healthy) never
  # starts.
  redis:
    profiles: ["dev"]
    image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    restart: unless-stopped
    env_file:
      - .env.dev
    command:
      - "redis-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "128mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
    # Loopback-only: published solely so the redis-cli verification recipes in
    # docs/runbooks work from the host. Nothing outside the host needs it.
    ports:
      - "127.0.0.1:8093:6379"
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  jaeger:
    profiles: ["dev"]
    image: jaegertracing/jaeger:latest@sha256:bf7f805da4c2bc8d58a6c81ee650fdb6b8e4287698f95fbe231c09c865bc397f
    restart: unless-stopped
    ports:
      - "8084:6831/udp"
      - "8085:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - backend

  # The federal BeSt Address register (FPS BOSA), self-contained.
  #
  # Part of the dev profile, so ./docker-stack.sh start brings it up with
  # everything else. Budget for it: the image is 1.6 GB and the container settles
  # around 1.7 GB resident. On Docker Desktop that usually means raising the WSL2
  # ceiling first (%UserProfile%\.wslconfig -> memory=12GB, then wsl --shutdown).
  #
  # There is deliberately NO depends_on from crm-backend, even though both are
  # now in the same profile. The healthcheck below waits for the address table to
  # be paged in, which takes ~45 s on a cold start — making the backend wait for
  # that would add three quarters of a minute to every single stack start, to
  # gate a feature that degrades to "no suggestions" on its own. crm-backend
  # discovers this service at runtime: with BEST_ADDRESS_URL blank, or the
  # container down, the picker is unbound and every form behaves as it did
  # before the feature existed.
  #
  # Data is baked into the image, so a `docker pull` IS the address-data refresh
  # — which is exactly why the reference below is pinned by digest. An unpinned
  # tag would mean the addresses under you change silently on someone else's
  # pull, and this dataset is what the map and the picker are BUILT on.
  # Renovate raises the refresh as an ordinary reviewable dependency PR instead:
  # .github/renovate.json extends docker:pinDigests, and carries the versioning
  # rule that teaches it to read this publisher's YYYY-WW tags.
  #
  # Licence: the address data is CC-BY 4.0. Attribution is required — Service
  # public de Wallonie, Paradigm.Brussels, Digitaal Vlaanderen.
  best-address:
    profiles: ["dev"]
    # 2026-35 = the ISO week-35 2026 extract, published 2026-08-31. `latest`
    # pointed at this same digest when it was pinned, verified against the
    # registry with `docker buildx imagetools inspect`.
    image: bosa/opendata-best-webapi:2026-35@sha256:371165f3e370e3d8476202bacea4c74bcbc8a02f944671b968826bcd64b6cf18
    restart: unless-stopped
    environment:
      - SERVER_PORT=8080
      # Do NOT set PGOPTIONS here. The image's CMD is
      #   pg_ctl start -D $$PGDATA $$PGOPTIONS && java -jar best-webapi.jar
      # with the variable UNQUOTED, so the value is word-split into raw pg_ctl
      # arguments — not server settings. `-c shared_buffers=512MB` makes pg_ctl
      # exit with "too many command-line arguments" and, with restart:
      # unless-stopped and nothing depending on this service, the container then
      # crash-loops in silence. Server tuning would have to go through `-o`, and
      # the unquoted expansion means `-o` can carry exactly one space-free
      # argument. The image's own defaults are fine: measured at ~1.65 GB
      # resident and sub-100 ms queries once warm.
    # Loopback-only, like crm-backend: this is reference data with no auth of
    # its own, and nothing outside the host has any business reaching it.
    ports:
      - "127.0.0.1:8096:8080"
    networks:
      - backend
    healthcheck:
      # NOT just /health. The first /addresses read after a cold start took 56
      # SECONDS (Postgres paging the address table in) against 0.09 s once warm,
      # and KrakenD's global timeout is 3000 ms — so a box that answers /health
      # but has never touched the address table is not ready in any useful
      # sense, and the first person to type an address would get a 504.
      #
      # curl, not wget: this image has no wget, and a probe that can never pass
      # leaves the container `starting` forever and then permanently unhealthy,
      # while the service underneath works perfectly. --max-time stays under the
      # `timeout` below so curl gives up before Docker kills it.
      test:
        [
          "CMD-SHELL",
          "curl -fsS --max-time 85 -o /dev/null 'http://localhost:8080/belgianAddress/v2/addresses?postCode=1000&page=1'",
        ]
      interval: 30s
      timeout: 90s
      retries: 5
      start_period: 120s

  swagger-doc-gen:
    profiles: ["init", "dev"]
    build:
      context: crm-backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./krakend/config:/app/docs/openapi
    # No `sleep` between the two: swagger-autogen writes with fs.writeFileSync, so the
    # file is closed before the promise settles, and the `mv` runs in THIS container
    # through the same mount — there is no flush to wait on. A sleep here also could
    # never have helped krakend-config see the result, since it precedes the rename.
    # It used to be `&& sleep 3 &&`, and those three seconds were the window the init
    # profile's abort cascade used to SIGKILL this container in. See docker-stack.sh.
    command: sh -c "npm run swagger && mv /app/docs/openapi/swagger.yaml /app/docs/openapi/root.yaml"

  generation-doc-gen:
    profiles: ["init", "dev"]
    build:
      context: allocation-key-generation
      dockerfile: Dockerfile
    volumes:
      - ./krakend/config:/output
    environment:
      - ENV=local
      - CRM_DATABASE_URL=postgresql+asyncpg://placeholder:placeholder@placeholder:5432/placeholder
      - LOCAL_DATABASE_URL=postgresql+asyncpg://placeholder:placeholder@placeholder:5432/placeholder
      - ALLOW_ORIGIN=*
    entrypoint: ["python", "scripts/export_openapi.py", "/output/generation.json"]

  simulation-doc-gen:
    profiles: ["init", "dev"]
    build:
      context: simulation-key
      dockerfile: Dockerfile
    volumes:
      - ./krakend/config:/output
    environment:
      - ENV=local
      - CRM_DATABASE_URL=postgresql+asyncpg://placeholder:placeholder@placeholder:5432/placeholder
      - LOCAL_DATABASE_URL=postgresql+asyncpg://placeholder:placeholder@placeholder:5432/placeholder
      - ALLOW_ORIGIN=*
    entrypoint: ["python", "scripts/export_openapi.py", "/output/simulation.json"]

  news-doc-gen:
    profiles: ["init", "dev"]
    build:
      context: news-board
      dockerfile: Dockerfile
    volumes:
      - ./krakend/config:/output
    environment:
      - ENV=local
      - CRM_DATABASE_URL=postgresql+asyncpg://placeholder:placeholder@placeholder:5432/placeholder
      - LOCAL_DATABASE_URL=postgresql+asyncpg://placeholder:placeholder@placeholder:5432/placeholder
      - ALLOW_ORIGIN=*
    entrypoint: ["python", "scripts/export_openapi.py", "/output/news.json"]

  billing-doc-gen:
    profiles: ["init", "dev"]
    build:
      context: billing
      dockerfile: Dockerfile
    volumes:
      - ./krakend/config:/output
    environment:
      - ENV=local
      - CRM_DATABASE_URL=postgresql+asyncpg://placeholder:placeholder@placeholder:5432/placeholder
      - LOCAL_DATABASE_URL=postgresql+asyncpg://placeholder:placeholder@placeholder:5432/placeholder
      - ALLOW_ORIGIN=*
    entrypoint: ["python", "scripts/export_openapi.py", "/output/billing.json"]

  administrative-document-doc-gen:
    profiles: ["init", "dev"]
    build:
      context: administrative-document
      dockerfile: Dockerfile
    volumes:
      - ./krakend/config:/output
    environment:
      - ENV=local
      - CRM_DATABASE_URL=postgresql+asyncpg://placeholder:placeholder@placeholder:5432/placeholder
      - LOCAL_DATABASE_URL=postgresql+asyncpg://placeholder:placeholder@placeholder:5432/placeholder
      - ALLOW_ORIGIN=*
    entrypoint:
      ["python", "scripts/export_openapi.py", "/output/administrative-document.json"]

  # TWO OpenAPI files out of ONE app, because KrakenD gates its JWT validator
  # per SERVICE ENTRY and never per endpoint - so the public enrol route needs
  # its own `services:` key with `auth: false`, and that needs its own swagger.
  #
  # `--split` refuses to write EITHER file unless the public operation set
  # equals the literal declared in api/live_public/routes.py, and it unlinks
  # both targets before writing: ./krakend/config is a gitignored bind mount
  # that is never cleaned, so a half-finished run would otherwise leave a stale
  # live-public.json for krakend-config to merge while printing "Success!".
  live-data-doc-gen:
    profiles: ["init", "dev"]
    build:
      context: live-data
      dockerfile: Dockerfile
    volumes:
      - ./krakend/config:/output
    environment:
      - ENV=local
      - CRM_DATABASE_URL=postgresql+asyncpg://placeholder:placeholder@placeholder:5432/placeholder
      - LOCAL_DATABASE_URL=postgresql+asyncpg://placeholder:placeholder@placeholder:5432/placeholder
      - ALLOW_ORIGIN=*
    entrypoint:
      [
        "python",
        "scripts/export_openapi.py",
        "--split",
        "/output/live.json",
        "/output/live-public.json",
      ]

  krakend-config:
    profiles: ["init", "dev"]
    build:
      context: krakend/swagger2krakend
      dockerfile: Dockerfile
    volumes:
      - ./krakend/config:/config
    environment:
      - CONFIG_FILE=/config/krakend-builder.yaml
      - OUTPUT_FILE=/config/krakend.json
    depends_on:
      swagger-doc-gen:
        condition: service_completed_successfully
      generation-doc-gen:
        condition: service_completed_successfully
      simulation-doc-gen:
        condition: service_completed_successfully
      news-doc-gen:
        condition: service_completed_successfully
      billing-doc-gen:
        condition: service_completed_successfully
      administrative-document-doc-gen:
        condition: service_completed_successfully
      live-data-doc-gen:
        condition: service_completed_successfully

  krakend:
    profiles: ["dev"]
    image: krakend:latest@sha256:bd392b692271209927da6c62f1b42d7f8f7bd0cd60b00d97c93bb5b8d42b4999
    ports:
      - "8086:8080"
    volumes:
      - ./krakend/config:/etc/krakend
    networks:
      - backend
      - reverse-proxy
    depends_on:
      crm-backend:
        condition: service_started
      allocation-key-generation:
        condition: service_started
      simulation-key:
        condition: service_started
      optimce-news-board:
        condition: service_started
      billing:
        condition: service_started
      administrative-document:
        condition: service_started
      live-data:
        condition: service_started
      keycloak:
        condition: service_started

  reverse-proxy:
    profiles: ["dev"]
    image: nginx:latest@sha256:7150b3a39203cb5bee612ff4a9d18774f8c7caf6399d6e8985e97e28eb751c18
    ports:
      - "8087:80"
      - "8088:443"
    volumes:
