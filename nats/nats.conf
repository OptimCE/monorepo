# Read by the `nats` service next to its command-line flags (JetStream, its store and
# the monitoring port stay there).
#
# max_payload: the default is 1 MiB. A data export's `export.part.done` carries the
# list of every file and reference of one part (the schema allows 10,000 files and
# 100,000 references), so a community with a few years of PDFs passes 1 MiB near 4,000
# files: the publish is refused and the export fails after its three 30-minute attempts.
# 8 MiB is the largest value NATS recommends. The clients read it from the server.
max_payload: 8MB
